<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Video Analytics & Checker</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #2a2f3d;
      --text: #e6e8ef;
      --muted: #949ba8;
      --accent: #00f2ea;
      --accent2: #ff0050;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; }
    h2 { margin: 0 0 14px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .input-box { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 14px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 12px 18px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #00b8b2); color: #091014;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .report {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; white-space: pre-wrap; font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px; line-height: 1.6; display: none;
    }
    .copy-btn {
      margin-top: 10px; background: #252a37; color: var(--text); font-size: 12px; padding: 8px 14px;
    }
    .error { color: #ff6b81; font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📹 TikTok Video • Analytics Checker</h2>
    <div class="input-box">
      <input type="text" id="urlInput" placeholder="Tempel link video TikTok (vt.tiktok.com / tiktok.com)..." />
      <button id="checkBtn" onclick="analyzeVideo()">Periksa</button>
    </div>
    <div id="errorBox" class="error"></div>
    <div id="reportBox" class="report"></div>
    <button id="copyBtn" class="copy-btn" style="display:none;" onclick="copyReport()">Salin Hasil Analisis</button>
  </div>

  <script>
    const regionNames = new Intl.DisplayNames(['en'], { type: 'region' });

    function countryFlag(code) {
      if (!code || code.length !== 2) return '🌐';
      return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
    }

    function formatDate(unixSec) {
      if (!unixSec) return '-';
      const d = new Date(unixSec * 1000);
      const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const pad = n => String(n).padStart(2, '0');
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function formatDuration(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function detectSource(data) {
      const w = data.width || 0;
      const h = data.height || 0;
      const standardMobile = [540, 576, 720, 1080];
      const isNonStandardDim = w > 0 && !standardMobile.includes(w);
      if (data.is_upload_by_web || isNonStandardDim) return 'Browser';
      return 'TikTok App (Mobile)';
    }

    async function analyzeVideo() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('checkBtn');
      const err = document.getElementById('errorBox');
      const rep = document.getElementById('reportBox');
      const copyBtn = document.getElementById('copyBtn');

      err.style.display = 'none';
      if (!url) {
        err.textContent = 'Masukkan tautan video TikTok terlebih dahulu.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memeriksa...';

      try {
        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
        const json = await res.json();

        if (json.code !== 0 || !json.data) {
          throw new Error(json.msg || 'Gagal mengambil metadata video. Pastikan video bersifat publik.');
        }

        const d = json.data;
        const duration = d.duration || 1;
        const width = d.width || 576;
        const height = d.height || 1024;
        const shortSide = Math.min(width, height);
        const fps = d.fps || (d.hd_size && d.size && d.hd_size > d.size * 1.4 ? 60 : 30);

        const hdBytes = d.hd_size || d.size || 0;
        const sdBytes = d.size || hdBytes;
        const hdMB = (hdBytes / (1024 * 1024)).toFixed(1);
        const sdMB = (sdBytes / (1024 * 1024)).toFixed(1);
        const hdMbps = ((hdBytes * 8) / (duration * 1000000)).toFixed(1);
        const sdMbps = ((sdBytes * 8) / (duration * 1000000)).toFixed(1);

        const regionCode = (d.region || 'ID').toUpperCase();
        let countryLabel = regionCode;
        try { countryLabel = regionNames.of(regionCode); } catch (e) {}

        const source = detectSource(d);
        const shadowBan = (d.is_prohibited || d.status === 10222) ? 'Yes (Restricted)' : 'No';
        const vqScore = d.vq_score !== undefined ? d.vq_score : 0;
        const musicTitle = d.music_info?.title || 'original sound';
        const musicAuthor = d.music_info?.author || d.author?.unique_id || '-';

        const output =
`📹 VIDEO • ANALYTICS

🎵 ${d.author?.nickname || '-'}  🗓 ${formatDate(d.create_time)}
${d.title || '(Tanpa caption)'}
🎵 ${musicTitle} - ${musicAuthor} • ${formatDuration(duration)}

📊 Statistics
  • 👁 ${(d.play_count || 0).toLocaleString('en-US')} Views
  • ❤️ ${(d.digg_count || 0).toLocaleString('en-US')} Likes
  • 💬 ${(d.comment_count || 0).toLocaleString('en-US')} Comments
  • ⭐️ ${(d.collect_count || 0).toLocaleString('en-US')} Favorites
  • ➡️ ${(d.share_count || 0).toLocaleString('en-US')} Shares
  • ⬇️ ${(d.download_count || 0).toLocaleString('en-US')} Downloads

ℹ️ Information
  • 🗂 ID | ${d.id}
  • 🔗 Source | ${source}
  • 📍 Region | ${countryFlag(regionCode)} ${countryLabel}
  • 👻 Shadow ban | ${shadowBan}

⭐️ Quality
  • 🌐 Browser | ${shortSide}p${fps}
  • 📱 Phone | ${shortSide}p${fps}
🌐play_addr 🌐original_720_0
 ${shortSide}p${fps} • ${hdMbps} Mbps • hevc • ${hdMB} MB

📱play_addr
 ${shortSide}p${fps} • ${sdMbps} Mbps • hevc • ${sdMB} MB
 ┃ Original | ${width}x${height}
 ┃ VQ Score | ${vqScore}`;

        rep.textContent = output;
        rep.style.display = 'block';
        copyBtn.style.display = 'inline-block';
      } catch (e) {
        err.textContent = 'Error: ' + e.message;
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Periksa';
      }
    }

    function copyReport() {
      navigator.clipboard.writeText(document.getElementById('reportBox').textContent);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Tersalin!';
      setTimeout(() => btn.textContent = 'Salin Hasil Analisis', 1500);
    }
  </script>
</body>
</html>
